name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: pip install -e ".[dev,viz]"

      - name: Run test suite
        # The raw DS-005 HDF5 archive is intentionally not stored in GitHub.
        # Full data-integration tests remain available locally with plain pytest.
        run: python -m pytest -q -m "not requires_ds005"
