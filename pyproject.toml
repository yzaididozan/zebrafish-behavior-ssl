[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafish-behavior-ssl"
version = "0.1.0"
description = "Self-supervised temporal representation learning for reproducible discovery of zebrafish behavioral structure."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "h5py>=3.10,<4",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7"
]

viz = [
  "matplotlib>=3.8,<4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
  "requires_ds005: requires the local, untracked DS-005 raw HDF5 dataset",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
